<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#fff">
    <defs>
        <!-- Invert: polygons become black -->
        <style>.d{fill:#000;}</style>
    </defs>
    <g id="a"/><g id="b"><g id="c">
    <!-- Inherits white from root, so background is white -->
    <rect width="24" height="24"/>
    <g>
        <polygon class="d" points="4.03 4 4.03 20 12 20 12 12 4.03 4"/>
        <polygon class="d" points="12 4 19.97 4 19.97 20 12 12 12 4"/>
    </g>
</g></g>
</svg>
